# Exact same JDK setup as vlees-main (working reference project)
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.10.7-hotspot
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.experimental.enableSourceSetPathsMap=true


# Identifier read by the AmneziaWG `tools/` CMake build when re-
# compiling libwg-go.so. Not strictly required at runtime (the .so
# files are pre-built), but keeping the property in sync with gwvpn
# avoids surprises if someone ever rebuilds the native bits.
amneziawgPackageName=org.amnezia.awg

systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=10809
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=10809
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.org.gradle.internal.repository.max.tentatives=10
systemProp.org.gradle.internal.repository.initial.backoff=500
android.enableR8.fullMode=false
android.builtInKotlin=false
android.newDsl=false
