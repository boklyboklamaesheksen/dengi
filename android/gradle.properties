# Use JAVA_HOME; do not commit a developer-specific JDK or proxy.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true


# Identifier read by the AmneziaWG `tools/` CMake build when re-
# compiling libwg-go.so. Not strictly required at runtime (the .so
# files are pre-built), but keeping the property in sync with gwvpn
# avoids surprises if someone ever rebuilds the native bits.
amneziawgPackageName=org.amnezia.awg

systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.http.connectionTimeout=60000
android.enableR8.fullMode=true
android.r8.optimizedResourceShrinking=true
# AGP 9 compatibility mode used by Flutter 3.44+ while plugins still apply the
# Kotlin Gradle Plugin and the legacy AGP DSL (flutter/flutter#183910).
android.builtInKotlin=false
android.newDsl=false
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
